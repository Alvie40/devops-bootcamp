<text x="780" y="828" font-size="13" font-weight="700" fill="#0b2a4a">3 pontos que a banca vai cobrar</text>
<text x="780" y="852" font-size="11.5" fill="#33404d">• Checagens estaticas (SAST/SCA/secrets) rodam em 3 estagios: IDE + Source + Build — nao uma vez so.</text>
<text x="780" y="874" font-size="11.5" fill="#33404d">• Scan diz 'a imagem esta limpa'. Assinatura (cosign) diz 'e a mesma que eu construi' — sao coisas diferentes.</text>
<text x="780" y="896" font-size="11.5" fill="#33404d">• Tag e movel e pode ser reescrita; digest @sha256 nao. Deploy por digest, nunca :latest.</text>
<text x="780" y="918" font-size="11.5" fill="#33404d">• SBOM: exigencia do FDA para software de dispositivo medico desde 2023 — nao so boa pratica.</text>
<text x="780" y="940" font-size="11.5" fill="#33404d">• Distroless nem sempre ganha: medi 49 CVEs (2 CRITICAL) vs slim endurecido 44 (0). Medir &gt; supor.</text>
